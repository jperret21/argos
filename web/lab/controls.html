<!doctype html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ARGOS Lab: controls</title>
    <script>
      // Theme and motion before the first paint (no graphite flash in Night Red).
      // Lab only: ?theme=observatory|charcoal|night-red, ?motion=system|reduced.
      // The lab never writes the app's argos.* storage keys.
      try {
        var q = new URLSearchParams(location.search);
        var t = q.get('theme');
        if (t === 'observatory' || t === 'charcoal' || t === 'night-red') {
          document.documentElement.setAttribute('data-theme', t);
        }
        if (q.get('motion') === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
      } catch (e) {
        /* keep the defaults */
      }
    </script>
  </head>
  <body>
    <div id="lab"></div>
    <script type="module" src="/src/lab/controls/main.ts"></script>
  </body>
</html>
