<!doctype html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ARGOS Lab: workspace</title>
    <script>
      // Theme, motion and density before the first paint (no graphite flash in
      // Night Red). Lab only: ?theme=observatory|charcoal|night-red,
      // ?motion=system|reduced|full, ?density=compact|comfortable.
      // The lab never writes the app's argos.theme key.
      try {
        var q = new URLSearchParams(location.search);
        var t = q.get('theme');
        if (t === 'observatory' || t === 'charcoal' || t === 'night-red') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var m = q.get('motion');
        if (m === 'reduced' || m === 'full') document.documentElement.setAttribute('data-motion', m);
        var d = q.get('density');
        if (d === 'comfortable') document.documentElement.setAttribute('data-density', d);
      } catch (e) {
        /* keep the defaults */
      }
    </script>
  </head>
  <body>
    <div id="lab-workspace"></div>
    <script type="module" src="/src/lab/workspace/main.ts"></script>
  </body>
</html>
